<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cargando servidor</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

/* Contenedor de fondo */
#background-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
}

#background-image {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ajuste automático */
    transition: opacity 1s ease-in-out; /* Fade suave */
    position: absolute;
    top:0;
    left:0;
}

/* Overlay oscuro */
.overlay {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);
    z-index:-1;
}

/* Contenido centrado */
#container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 80%;
    max-width: 1000px;
}

/* Logo del servidor */
#server-logo {
    max-width: 200px;
    margin-bottom: 10px;
}

/* Subtexto debajo del logo */
#logo-subtext {
    font-size: 18px;
    color: #ccc;
    margin-bottom: 30px;
}

/* Texto principal */
h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

p {
    font-size: 20px;
    color: #ccc;
    margin-bottom: 30px;
}

/* Barra de carga animada */
.loadingbar {
    width: 400px;
    height: 10px;
    background: #222;
    margin: 30px auto;
    border-radius: 10px;
    overflow: hidden;
}

.bar {
    width: 40%;
    height: 100%;
    background: #4caf50;
    animation: loading 2s infinite;
}

@keyframes loading {
    0% {margin-left: -40%;}
    100% {margin-left: 100%;}
}

/* Equipo */
.team {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 30px;
}

.member {
    width: 180px;
    margin: 10px;
    text-align: center;
}

.member img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 10px;
    border: 2px solid #4caf50;
}

.member-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.member-role {
    font-size: 14px;
    color: #aaa;
}
</style>
</head>

<body>

<div id="background-container">
    <img id="background-image" src="images/backgrounds/bg1.jpg" alt="Background">
</div>
<div class="overlay"></div>

<div id="container">
    <img id="server-logo" src="images/logo_a.png" alt="Logo Servidor">
    <div id="logo-subtext">BarricadasRP</div>

    <h1>Bienvenido al servidor Stalker RP</h1>
    <p id="loading-status">Cargando el servidor...</p>

    <div class="loadingbar">
        <div class="bar"></div>
    </div>

    <div class="team">
        <div class="member">
            <img src="images/team/person1.jpg" alt="Miembro 1">
            <div class="member-name">Poroto</div>
            <div class="member-role">Asuntos externos y colaboraciones</div>
        </div>
        <div class="member">
            <img src="images/team/person2.jpg" alt="Miembro 2">
            <div class="member-name">Fuser</div>
            <div class="member-role">Programador Lua</div>
        </div>
        <div class="member">
            <img src="images/team/person3.jpg" alt="Miembro 3">
            <div class="member-name">Pichi</div>
            <div class="member-role">Creador de Mapas</div>
        </div>
    </div>
</div>

<audio id="ambient-loop" autoplay loop>
    <source src="stalker.ogg" type="audio/ogg">
</audio>

<script>
// Slideshow de fondos
const backgrounds = [
    "images/backgrounds/bg1.jpg",
    "images/backgrounds/bg2.jpg",
    "images/backgrounds/bg3.jpg",
    "images/backgrounds/bg4.jpg",
    "images/backgrounds/bg5.jpg"
];

let index = 0;
const bgElement = document.getElementById("background-image");

function changeBackground() {
    const nextIndex = (index + 1) % backgrounds.length;
    const nextImage = new Image();
    nextImage.src = backgrounds[nextIndex];
    nextImage.onload = () => {
        bgElement.style.opacity = 0;
        setTimeout(() => {
            bgElement.src = backgrounds[nextIndex];
            bgElement.style.opacity = 1;
            index = nextIndex;
        }, 500);
    }
}

bgElement.src = backgrounds[index];
setInterval(changeBackground, 8000);

// Forzar la reproducción del archivo .ogg en el motor de Garry's Mod
window.addEventListener("DOMContentLoaded", () => {
    const audio = document.getElementById("ambient-loop");
    
    // Volumen al 35% (puedes variarlo de 0.0 a 1.0)
    audio.volume = 0.35; 
    
    audio.play().catch(e => {
        console.log("Esperando interacción o carga para activar el sonido.");
    });
});

// INTEGRACIÓN CON GARRY'S MOD: Muestra qué archivo real se está bajando
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    document.getElementById("loading-status").innerHTML = "Conectando a: " + servername + "<br>Cargando mapa: " + mapname;
}

function SetFilesNeeded(needed) {
    // Función nativa opcional de GMod
}

function SetStatusChanged(status) {
    // Actualiza dinámicamente el texto según lo que hace el juego
    document.getElementById("loading-status").innerText = status;
}
</script>

</body>
</html>
